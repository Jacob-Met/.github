name: Seed
description: A small, self-contained unit of work any worker can claim and land by PR.
title: "[seed] "
labels: ["seed:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Claim protocol: assign yourself or add the label `claimed` BEFORE starting. Open a PR that says "Closes #n". PR-only: never push to main or release branches.
  - type: textarea
    id: summary
    attributes:
      label: What it does and what is left to land it
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Fixed interface / contract
      description: Signatures, file formats or endpoints that must not change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Failing acceptance test
      description: Exact command, and the expected failure until the work is done.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Single owner file or folder
      description: The only path this work may touch.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: checkboxes
    id: claim
    attributes:
      label: Claim protocol
      options:
        - label: I assigned myself or added the `claimed` label before starting
          required: true
        - label: My PR will say "Closes #n" and target a non-main, non-release branch workflow (PR-only)
          required: true
